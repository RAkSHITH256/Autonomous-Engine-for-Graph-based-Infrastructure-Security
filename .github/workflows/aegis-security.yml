name: AEGIS Security Pipeline

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  test:
    name: Run AEGIS Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install AEGIS dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirement.txt
          pip install pytest neo4j

      - name: Run tests
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: pytest -q

  trivy:
    name: Trivy Filesystem Scan
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create reports directory
        run: mkdir -p security/reports

      - name: Run Trivy JSON scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: .
          format: json
          output: security/reports/trivy.json
          severity: CRITICAL,HIGH,MEDIUM,LOW
          ignore-unfixed: false
          exit-code: "0"

      - name: Upload Trivy report
        uses: actions/upload-artifact@v4
        with:
          name: aegis-trivy
          path: security/reports/trivy.json
          retention-days: 30

  semgrep:
    name: Semgrep Source Scan
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Semgrep
        run: pip install semgrep

      - name: Create reports directory
        run: mkdir -p security/reports

      - name: Run Semgrep JSON scan
        run: |
          semgrep scan \
            --config p/python \
            --json \
            --output security/reports/semgrep.json \
            . || true

      - name: Upload Semgrep report
        uses: actions/upload-artifact@v4
        with:
          name: aegis-semgrep
          path: security/reports/semgrep.json
          retention-days: 30

  sbom:
    name: Generate SBOM
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate CycloneDX SBOM
        uses: anchore/sbom-action@v0
        with:
          path: .
          format: cyclonedx-json
          output-file: security/reports/sbom.json

      - name: Upload SBOM
        uses: actions/upload-artifact@v4
        with:
          name: aegis-sbom
          path: security/reports/sbom.json
          retention-days: 30

  aegis-analysis:
    name: AEGIS Analysis and Report
    runs-on: ubuntu-latest
    needs:
      - test
      - trivy
      - semgrep
      - sbom

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download Trivy report
        uses: actions/download-artifact@v4
        with:
          name: aegis-trivy
          path: security/reports

      - name: Download Semgrep report
        uses: actions/download-artifact@v4
        with:
          name: aegis-semgrep
          path: security/reports

      - name: Download SBOM
        uses: actions/download-artifact@v4
        with:
          name: aegis-sbom
          path: security/reports

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install AEGIS dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirement.txt
          pip install pytest neo4j

      - name: Run AEGIS report engine
        env:
          PYTHONPATH: ${{ github.workspace }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
        run: |
          python scripts/aegis_ci_report.py \
            --trivy security/reports/trivy.json \
            --semgrep security/reports/semgrep.json \
            --sbom security/reports/sbom.json \
            --output security/reports

      - name: Publish AEGIS summary
        if: always()
        run: |
          if [ -f security/reports/aegis-report.md ]; then
            cat security/reports/aegis-report.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload complete AEGIS report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aegis-security-report
          path: security/reports/
          retention-days: 30

  security-gate:
    name: AEGIS Security Gate
    runs-on: ubuntu-latest
    needs:
      - aegis-analysis

    steps:
      - name: Verify AEGIS report
        run: |
          echo "AEGIS analysis completed."
          echo "The detailed JSON/Markdown report is available as a workflow artifact."
