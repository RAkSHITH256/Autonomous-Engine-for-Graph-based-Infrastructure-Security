name: AEGIS Security Pipeline

on:
  push:
    branches:
      - main
      - develop

  pull_request:
    branches:
      - main

  workflow_dispatch:


permissions:
  contents: read
  security-events: write
  packages: write


# ============================================================
# JOBS
# ============================================================

jobs:

  # ============================================================
  # TEST
  # ============================================================

  test:
    name: Run AEGIS Tests
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install AEGIS dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirement.txt
          pip install pytest

      - name: Run tests
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          pytest -q


  # ============================================================
  # TRIVY
  # ============================================================

  trivy:
    name: Trivy Filesystem Scan
    runs-on: ubuntu-latest
    needs: test

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create reports directory
        run: |
          mkdir -p security/reports

      - name: Run Trivy JSON scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: .
          format: json
          output: security/reports/trivy.json
          severity: CRITICAL,HIGH,MEDIUM,LOW
          ignore-unfixed: false
          exit-code: "0"

      - name: Upload Trivy report
        uses: actions/upload-artifact@v4
        with:
          name: aegis-trivy
          path: security/reports/trivy.json
          retention-days: 30


  # ============================================================
  # SEMGREP
  # ============================================================

  semgrep:
    name: Semgrep Source Scan
    runs-on: ubuntu-latest
    needs: test

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Semgrep
        run: |
          pip install semgrep

      - name: Create reports directory
        run: |
          mkdir -p security/reports

      - name: Run Semgrep JSON scan
        run: |
          semgrep scan \
            --config p/python \
            --json \
            --output security/reports/semgrep.json \
            . || true

      - name: Upload Semgrep report
        uses: actions/upload-artifact@v4
        with:
          name: aegis-semgrep
          path: security/reports/semgrep.json
          retention-days: 30


  # ============================================================
  # SBOM
  # ============================================================

  sbom:
    name: Generate SBOM
    runs-on: ubuntu-latest
    needs: test

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create reports directory
        run: |
          mkdir -p security/reports

      - name: Generate CycloneDX SBOM
        uses: anchore/sbom-action@v0
        with:
          path: .
          format: cyclonedx-json
          output-file: security/reports/sbom.json

      - name: Verify SBOM
        run: |
          ls -lh security/reports/sbom.json
          test -s security/reports/sbom.json

      - name: Upload SBOM
        uses: actions/upload-artifact@v4
        with:
          name: aegis-sbom
          path: security/reports/sbom.json
          retention-days: 30


  # ============================================================
  # CONTAINER BUILD + GHCR + PROVENANCE
  # ============================================================

  container-build:
    name: Build and Publish AEGIS Container
    runs-on: ubuntu-latest

    needs:
      - test
      - trivy
      - semgrep
      - sbom

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      # --------------------------------------------------------
      # Docker Buildx
      # --------------------------------------------------------

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3


      # --------------------------------------------------------
      # Determine GHCR image name
      # --------------------------------------------------------

      - name: Set GHCR image name
        id: image
        run: |
          IMAGE="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/aegis"

          echo "name=$IMAGE" >> "$GITHUB_OUTPUT"

          echo "========================================"
          echo "GHCR IMAGE"
          echo "========================================"
          echo "$IMAGE"


      # --------------------------------------------------------
      # Login to GitHub Container Registry
      #
      # Do NOT login for pull requests.
      # This prevents fork PRs from attempting to push.
      # --------------------------------------------------------

      - name: Login to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}


      # --------------------------------------------------------
      # Build image
      # --------------------------------------------------------

      - name: Build AEGIS container
        env:
          IMAGE: ${{ steps.image.outputs.name }}

        run: |
          docker build \
            --file backend/Dockerfile \
            --tag "$IMAGE:${{ github.sha }}" \
            --tag "$IMAGE:latest" \
            .


      # --------------------------------------------------------
      # Inspect image
      # --------------------------------------------------------

      - name: Inspect AEGIS image
        env:
          IMAGE: ${{ steps.image.outputs.name }}

        run: |
          docker image inspect "$IMAGE:${{ github.sha }}"


      # --------------------------------------------------------
      # Push immutable SHA tag + latest tag
      # --------------------------------------------------------

      - name: Push AEGIS image to GHCR
        if: github.event_name != 'pull_request'
        env:
          IMAGE: ${{ steps.image.outputs.name }}

        run: |
          echo "Pushing immutable image tag..."
          docker push "$IMAGE:${{ github.sha }}"

          echo "Pushing latest tag..."
          docker push "$IMAGE:latest"


      # --------------------------------------------------------
      # Resolve immutable registry digest
      # --------------------------------------------------------

      - name: Resolve registry digest
        if: github.event_name != 'pull_request'
        id: digest

        env:
          IMAGE: ${{ steps.image.outputs.name }}

        run: |
          DIGEST=$(docker buildx imagetools inspect \
            "$IMAGE:${{ github.sha }}" \
            --format '{{.Manifest.Digest}}')

          if [ -z "$DIGEST" ]; then
            echo "ERROR: Registry digest could not be resolved."
            exit 1
          fi

          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"

          echo "========================================"
          echo "IMMUTABLE REGISTRY DIGEST"
          echo "========================================"
          echo "$DIGEST"


      # --------------------------------------------------------
      # Generate build provenance
      # --------------------------------------------------------

      - name: Generate build provenance

        env:
          IMAGE: ${{ steps.image.outputs.name }}
          DIGEST: ${{ steps.digest.outputs.digest }}

        run: |
          mkdir -p security/reports

          CREATED=$(docker image inspect \
            "$IMAGE:${{ github.sha }}" \
            --format '{{.Created}}')

          # ----------------------------------------------------
          # For normal pushes:
          #
          #   image = GHCR immutable digest
          #   image_id = registry digest
          #
          # For pull requests:
          #
          #   image = temporary SHA tag
          #   image_id = local Docker image ID
          # ----------------------------------------------------

          if [ -n "$DIGEST" ]; then

            IMAGE_REFERENCE="${IMAGE}@${DIGEST}"
            IMAGE_ID="${DIGEST}"

          else

            IMAGE_REFERENCE="${IMAGE}:${GITHUB_SHA}"

            IMAGE_ID=$(docker image inspect \
              "$IMAGE:${{ github.sha }}" \
              --format '{{.Id}}')

          fi

          echo "========================================"
          echo "BUILD PROVENANCE"
          echo "========================================"

          echo "Image:"
          echo "$IMAGE_REFERENCE"

          echo ""
          echo "Image ID:"
          echo "$IMAGE_ID"

          echo ""
          echo "Created:"
          echo "$CREATED"


          cat > security/reports/build-provenance.json <<EOF
          {
            "provider": "github-actions",
            "repository": "${{ github.repository }}",
            "workflow": "${{ github.workflow }}",
            "run_id": "${{ github.run_id }}",
            "run_number": ${{ github.run_number }},
            "commit_sha": "${{ github.sha }}",
            "branch": "${{ github.ref_name }}",
            "image": "${IMAGE_REFERENCE}",
            "image_id": "${IMAGE_ID}",
            "created": "${CREATED}"
          }
          EOF


      # --------------------------------------------------------
      # Validate provenance JSON
      # --------------------------------------------------------

      - name: Validate build provenance
        run: |
          python -m json.tool \
            security/reports/build-provenance.json \
            > /dev/null

          echo "Build provenance JSON is valid."


      # --------------------------------------------------------
      # Display provenance
      # --------------------------------------------------------

      - name: Display build provenance
        run: |
          echo "========================================"
          echo "AEGIS BUILD PROVENANCE"
          echo "========================================"

          cat security/reports/build-provenance.json


      # --------------------------------------------------------
      # Upload provenance
      # --------------------------------------------------------

      - name: Upload build provenance
        uses: actions/upload-artifact@v4
        with:
          name: aegis-build-provenance
          path: security/reports/build-provenance.json
          retention-days: 30


  # ============================================================
  # AEGIS ANALYSIS
  # ============================================================

  aegis-analysis:
    name: AEGIS Analysis and Report
    runs-on: ubuntu-latest

    needs:
      - test
      - trivy
      - semgrep
      - sbom
      - container-build

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4


      # --------------------------------------------------------
      # Download Trivy
      # --------------------------------------------------------

      - name: Download Trivy report
        uses: actions/download-artifact@v4
        with:
          name: aegis-trivy
          path: security/reports


      # --------------------------------------------------------
      # Download Semgrep
      # --------------------------------------------------------

      - name: Download Semgrep report
        uses: actions/download-artifact@v4
        with:
          name: aegis-semgrep
          path: security/reports


      # --------------------------------------------------------
      # Download SBOM
      # --------------------------------------------------------

      - name: Download SBOM
        uses: actions/download-artifact@v4
        with:
          name: aegis-sbom
          path: security/reports


      # --------------------------------------------------------
      # Download build provenance
      # --------------------------------------------------------

      - name: Download build provenance
        uses: actions/download-artifact@v4
        with:
          name: aegis-build-provenance
          path: security/reports


      # --------------------------------------------------------
      # Setup Python
      # --------------------------------------------------------

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"


      # --------------------------------------------------------
      # Install dependencies
      # --------------------------------------------------------

      - name: Install AEGIS dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirement.txt
          pip install pytest


      # --------------------------------------------------------
      # Run AEGIS report engine
      # --------------------------------------------------------

      - name: Run AEGIS report engine
        env:
          PYTHONPATH: ${{ github.workspace }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_REF_NAME: ${{ github.ref_name }}

        run: |
          python scripts/aegis_ci_report.py \
            --trivy security/reports/trivy.json \
            --semgrep security/reports/semgrep.json \
            --sbom security/reports/sbom.json \
            --output security/reports


      # --------------------------------------------------------
      # Publish GitHub summary
      # --------------------------------------------------------

      - name: Publish AEGIS summary
        if: always()

        run: |
          if [ -f security/reports/aegis-report.md ]; then
            cat security/reports/aegis-report.md >> "$GITHUB_STEP_SUMMARY"
          fi


      # --------------------------------------------------------
      # Upload complete report
      # --------------------------------------------------------

      - name: Upload complete AEGIS report
        if: always()

        uses: actions/upload-artifact@v4

        with:
          name: aegis-security-report
          path: security/reports/
          retention-days: 30


  # ============================================================
  # SECURITY GATE
  # ============================================================

  security-gate:
    name: AEGIS Security Gate
    runs-on: ubuntu-latest

    needs:
      - aegis-analysis

    steps:

      - name: Verify AEGIS report
        run: |
          echo "AEGIS analysis completed."