name: AEGIS Security Pipeline

on:
  push:
    branches:
      - main
      - develop

  pull_request:
    branches:
      - main

  workflow_dispatch:


permissions:
  contents: read
  security-events: write


# ============================================================
# TEST
# ============================================================

jobs:

  test:
    name: Run AEGIS Tests
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install AEGIS dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirement.txt
          pip install pytest

      - name: Run tests
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          pytest -q


  # ============================================================
  # TRIVY
  # ============================================================

  trivy:
    name: Trivy Filesystem Scan
    runs-on: ubuntu-latest
    needs: test

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create reports directory
        run: |
          mkdir -p security/reports

      - name: Run Trivy JSON scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: .
          format: json
          output: security/reports/trivy.json
          severity: CRITICAL,HIGH,MEDIUM,LOW
          ignore-unfixed: false
          exit-code: "0"

      - name: Upload Trivy report
        uses: actions/upload-artifact@v4
        with:
          name: aegis-trivy
          path: security/reports/trivy.json
          retention-days: 30


  # ============================================================
  # SEMGREP
  # ============================================================

  semgrep:
    name: Semgrep Source Scan
    runs-on: ubuntu-latest
    needs: test

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Semgrep
        run: |
          pip install semgrep

      - name: Create reports directory
        run: |
          mkdir -p security/reports

      - name: Run Semgrep JSON scan
        run: |
          semgrep scan \
            --config p/python \
            --json \
            --output security/reports/semgrep.json \
            . || true

      - name: Upload Semgrep report
        uses: actions/upload-artifact@v4
        with:
          name: aegis-semgrep
          path: security/reports/semgrep.json
          retention-days: 30


  # ============================================================
  # SBOM
  # ============================================================

  sbom:
    name: Generate SBOM
    runs-on: ubuntu-latest
    needs: test

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create reports directory
        run: |
          mkdir -p security/reports

      - name: Generate CycloneDX SBOM
        uses: anchore/sbom-action@v0
        with:
          path: .
          format: cyclonedx-json
          output-file: security/reports/sbom.json

      - name: Verify SBOM
        run: |
          ls -lh security/reports/sbom.json
          test -s security/reports/sbom.json

      - name: Upload SBOM
        uses: actions/upload-artifact@v4
        with:
          name: aegis-sbom
          path: security/reports/sbom.json
          retention-days: 30


  # ============================================================
  # CONTAINER BUILD + PROVENANCE
  # ============================================================

  container-build:
    name: Build AEGIS Container
    runs-on: ubuntu-latest

    needs:
      - test
      - trivy
      - semgrep
      - sbom

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      # --------------------------------------------------------
      # Docker Buildx
      # --------------------------------------------------------

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      # --------------------------------------------------------
      # Build image
      # --------------------------------------------------------

      - name: Build AEGIS container
        run: |
          docker build \
            --file backend/Dockerfile \
            --tag aegis:${{ github.sha }} \
            --tag aegis:latest \
            .

      # --------------------------------------------------------
      # Inspect image
      # --------------------------------------------------------

      - name: Inspect AEGIS image
        run: |
          docker image inspect aegis:${{ github.sha }}

      # --------------------------------------------------------
      # Extract image metadata
      # --------------------------------------------------------

      - name: Generate image metadata
        run: |
          mkdir -p security/reports

          IMAGE_ID=$(docker image inspect \
            aegis:${{ github.sha }} \
            --format '{{.Id}}')

          CREATED=$(docker image inspect \
            aegis:${{ github.sha }} \
            --format '{{.Created}}')

          echo "IMAGE_ID=$IMAGE_ID"
          echo "CREATED=$CREATED"

          cat > security/reports/build-provenance.json <<EOF
          {
            "provider": "github-actions",
            "repository": "${{ github.repository }}",
            "workflow": "${{ github.workflow }}",
            "run_id": "${{ github.run_id }}",
            "run_number": "${{ github.run_number }}",
            "commit_sha": "${{ github.sha }}",
            "branch": "${{ github.ref_name }}",
            "image": "aegis:${{ github.sha }}",
            "image_id": "$IMAGE_ID",
            "created": "$CREATED"
          }
          EOF

      # --------------------------------------------------------
      # Display provenance
      # --------------------------------------------------------

      - name: Display build provenance
        run: |
          cat security/reports/build-provenance.json

      # --------------------------------------------------------
      # Upload provenance
      # --------------------------------------------------------

      - name: Upload build provenance
        uses: actions/upload-artifact@v4
        with:
          name: aegis-build-provenance
          path: security/reports/build-provenance.json
          retention-days: 30


  # ============================================================
  # AEGIS ANALYSIS
  # ============================================================

  aegis-analysis:
    name: AEGIS Analysis and Report
    runs-on: ubuntu-latest

    needs:
      - test
      - trivy
      - semgrep
      - sbom
      - container-build

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      # --------------------------------------------------------
      # Download Trivy
      # --------------------------------------------------------

      - name: Download Trivy report
        uses: actions/download-artifact@v4
        with:
          name: aegis-trivy
          path: security/reports

      # --------------------------------------------------------
      # Download Semgrep
      # --------------------------------------------------------

      - name: Download Semgrep report
        uses: actions/download-artifact@v4
        with:
          name: aegis-semgrep
          path: security/reports

      # --------------------------------------------------------
      # Download SBOM
      # --------------------------------------------------------

      - name: Download SBOM
        uses: actions/download-artifact@v4
        with:
          name: aegis-sbom
          path: security/reports

      # --------------------------------------------------------
      # Download build provenance
      # --------------------------------------------------------

      - name: Download build provenance
        uses: actions/download-artifact@v4
        with:
          name: aegis-build-provenance
          path: security/reports

      # --------------------------------------------------------
      # Setup Python
      # --------------------------------------------------------

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # --------------------------------------------------------
      # Install dependencies
      # --------------------------------------------------------

      - name: Install AEGIS dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirement.txt
          pip install pytest

      # --------------------------------------------------------
      # Run AEGIS report engine
      # --------------------------------------------------------

      - name: Run AEGIS report engine
        env:
          PYTHONPATH: ${{ github.workspace }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_REF_NAME: ${{ github.ref_name }}

        run: |
          python scripts/aegis_ci_report.py \
            --trivy security/reports/trivy.json \
            --semgrep security/reports/semgrep.json \
            --sbom security/reports/sbom.json \
            --output security/reports

      # --------------------------------------------------------
      # Publish GitHub summary
      # --------------------------------------------------------

      - name: Publish AEGIS summary
        if: always()
        run: |
          if [ -f security/reports/aegis-report.md ]; then
            cat security/reports/aegis-report.md >> "$GITHUB_STEP_SUMMARY"
          fi

      # --------------------------------------------------------
      # Upload complete report
      # --------------------------------------------------------

      - name: Upload complete AEGIS report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aegis-security-report
          path: security/reports/
          retention-days: 30


  # ============================================================
  # SECURITY GATE
  # ============================================================

  security-gate:
    name: AEGIS Security Gate
    runs-on: ubuntu-latest

    needs:
      - aegis-analysis

    steps:

      - name: Verify AEGIS report
        run: |
          echo "AEGIS analysis completed."
          echo "The detailed JSON/Markdown report is available as a workflow artifact."