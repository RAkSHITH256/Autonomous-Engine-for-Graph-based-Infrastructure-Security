services:

  neo4j:
    image: neo4j:latest
    container_name: aegis-neo4j

    ports:
      - "7474:7474"
      - "7687:7687"

    environment:
      NEO4J_AUTH: neo4j/aegisdev

    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs

  aegis:
    build:
      context: .
      dockerfile: backend/Dockerfile

    container_name: aegis-api

    ports:
      - "8000:8000"

    environment:
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USERNAME: neo4j
      NEO4J_PASSWORD: aegisdev

    depends_on:
      - neo4j

volumes:
  neo4j_data:
  neo4j_logs:
